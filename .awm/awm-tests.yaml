version: awm.tests.v1
defaults:
  cwd: .
  timeout_sec: 900
tests:
  - id: smoke
    summary: Run critical CLI, runtime, and service tests on every verification pass
    command:
      argv: ["go", "test", "./cmd/awm", "./cmd/awm-mcp", "./internal/runtime", "./internal/service/backend", "-count=1"]
      env:
        GOCACHE: "/tmp/agent-workflow-manager-gocache"
        GOMODCACHE: "/tmp/agent-workflow-manager-gomodcache"
    select:
      always_run: true
    expected:
      exit_code: 0

  - id: awm-feature-plan-help
    summary: Ensure the repo-local AWM staged-plan validator exposes help
    command:
      argv: ["python3", "scripts/awm-feature-plan-validate.py", "--help"]
    select:
      phases: ["execute", "review"]
      changed_paths_any: ["scripts/awm-feature-plan-validate.py"]
    expected:
      exit_code: 0

  - id: awm-feature-plan-validate
    summary: Validate the repo-local AWM staged-plan schema for governed work
    command:
      argv: ["python3", "scripts/awm-feature-plan-validate.py"]
    select:
      phases: ["execute", "review"]
      changed_paths_any: ["cmd/**", "go.mod", "go.sum", "internal/**", "scripts/**", "skills/**", "spec/**"]
    expected:
      exit_code: 0

  - id: cli-build
    summary: Ensure both CLI entrypoints still build
    command:
      argv: ["go", "build", "./cmd/awm", "./cmd/awm-mcp"]
      env:
        GOCACHE: "/tmp/agent-workflow-manager-gocache"
        GOMODCACHE: "/tmp/agent-workflow-manager-gomodcache"
    select:
      phases: ["execute", "review"]
      changed_paths_any: ["cmd/**", "internal/**", "go.mod", "go.sum"]
    expected:
      exit_code: 0

  - id: go-changed-packages
    summary: Run go test for packages touched by the current verify diff
    command:
      argv: ["python3", "scripts/awm-go-test-targets.py"]
      env:
        GOCACHE: "/tmp/agent-workflow-manager-gocache"
        GOMODCACHE: "/tmp/agent-workflow-manager-gomodcache"
    select:
      phases: ["execute", "review"]
      changed_paths_any: ["cmd/**", "internal/**", "go.mod", "go.sum"]
    expected:
      exit_code: 0

  - id: tdd-guard
    summary: Enforce this repo's TDD metadata and test-delta policy for Go behavior changes
    command:
      argv: ["python3", "scripts/awm-tdd-guard.py"]
    select:
      phases: ["execute", "review"]
      changed_paths_any: ["cmd/**", "internal/**", "scripts/**"]
    expected:
      exit_code: 0

  - id: full-go-suite
    summary: Run the full repository Go test suite for product changes
    command:
      argv: ["go", "test", "./..."]
      env:
        GOFLAGS: "-count=1"
        GOCACHE: "/tmp/agent-workflow-manager-gocache"
        GOMODCACHE: "/tmp/agent-workflow-manager-gomodcache"
    select:
      phases: ["review"]
      changed_paths_any: ["cmd/**", "internal/**", "spec/**", "skills/**", "scripts/**", "go.mod", "go.sum"]
    expected:
      exit_code: 0
