version: awm.init-template.v1
id: codex-hooks
summary: Seed experimental Codex hooks that reinforce the AWM task loop.
operations:
  - type: create_if_missing
    target: .codex/config.toml
    source: files/.codex/config.toml
  - type: create_if_missing
    target: .codex/hooks.json
    source: files/.codex/hooks.json
  - type: create_if_missing
    target: .codex/hooks/awm-common.sh
    source: files/.codex/hooks/awm-common.sh
    mode: "0755"
  - type: create_if_missing
    target: .codex/hooks/awm-session-context.sh
    source: files/.codex/hooks/awm-session-context.sh
    mode: "0755"
  - type: create_if_missing
    target: .codex/hooks/awm-prompt-guard.sh
    source: files/.codex/hooks/awm-prompt-guard.sh
    mode: "0755"
  - type: create_if_missing
    target: .codex/hooks/awm-stop-guard.sh
    source: files/.codex/hooks/awm-stop-guard.sh
    mode: "0755"
