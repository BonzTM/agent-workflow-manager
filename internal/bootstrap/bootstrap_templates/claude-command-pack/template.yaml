version: awm.init-template.v1
id: claude-command-pack
summary: Seed the Claude awm-broker command pack into .claude.
operations:
  - type: create_if_missing
    target: .claude/awm-broker/README.md
    source: files/.claude/awm-broker/README.md
  - type: create_if_missing
    target: .claude/awm-broker/CLAUDE.md
    source: files/.claude/awm-broker/CLAUDE.md
  - type: create_if_missing
    target: .claude/commands/awm-context.md
    source: files/.claude/commands/awm-context.md
  - type: create_if_missing
    target: .claude/commands/awm-done.md
    source: files/.claude/commands/awm-done.md
  - type: create_if_missing
    target: .claude/commands/awm-review.md
    source: files/.claude/commands/awm-review.md
  - type: create_if_missing
    target: .claude/commands/awm-verify.md
    source: files/.claude/commands/awm-verify.md
  - type: create_if_missing
    target: .claude/commands/awm-work.md
    source: files/.claude/commands/awm-work.md
