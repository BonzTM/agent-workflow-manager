version: awm.init-template.v1
id: opencode-pack
summary: Seed OpenCode AWM companion docs into .opencode/awm-broker.
operations:
  - type: create_if_missing
    target: .opencode/awm-broker/README.md
    source: files/.opencode/awm-broker/README.md
  - type: create_if_missing
    target: .opencode/awm-broker/AGENTS.example.md
    source: files/.opencode/awm-broker/AGENTS.example.md
