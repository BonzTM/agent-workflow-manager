version: awm.init-template.v1
id: verify-python
summary: Upgrade blank AWM test scaffolds to a Python-oriented starter verify profile.
operations:
  - type: replace_if_pristine
    target: .awm/awm-tests.yaml
    source: files/.awm/awm-tests.yaml
    pristine:
      - blank_tests_v1
  - type: replace_if_pristine
    target: awm-tests.yaml
    source: files/.awm/awm-tests.yaml
    pristine:
      - blank_tests_v1
